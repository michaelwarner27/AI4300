# Retrieval-only cases for "Dexter Trailer Catalog V1-24 p1-100.pdf".
# Used by tests/dexter_retrieval.py (see tests/dexter-ocr-test-plan.md, layer 3).
#
# Each query is run through the hybrid search against the whole corpus (no LLM).
# A case is a hit at k if any chunk from this file on one of `pages` ranks in the
# top k.
#
#   id         DXR-<category code><n>
#   category   part_number | spec | table_cell | disambiguation | image_only | concept
#   query      what a user would type
#   pages      acceptable PDF pages (1-based). Part-number pages were found by
#              searching the text layer for every page that prints the number.
#   wrong_pages  (disambiguation only) pages that must rank lower than the right page
#   chunk_type (optional) the chunk type that should hold the answer: text | table | diagram
#   xfail      true when the answer exists only in images (expected to miss before OCR)
#   verified   false until checked
#
# Page-tag bug (found while drafting, 2026-11-26): a text chunk is tagged with the
# page where it STARTS, and chunks run over page boundaries because heading
# detection fails on this catalog. Many facts are therefore stored under page N-1
# (e.g. D35 bearings under page 13, K23-026-00 under page 14). `pages` always lists
# the TRUE page. The retrieval script reports strict hits and also lenient hits
# (true page or the page before) so this bug stays visible apart from OCR effects.

