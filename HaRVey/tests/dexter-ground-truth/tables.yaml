# Table ground truth for "Dexter Trailer Catalog V1-24 p1-100.pdf".
# Used by tests/dexter_tables.py (see tests/dexter-ocr-test-plan.md, layer 2).
#
# Each table:
#   id        unique name
#   page      PDF page (1-based, not the catalog's A-number)
#   title     the heading printed above the table (used for the "found" check)
#   columns   flattened column names (multi-level headers joined with a space)
#   rows      cell values exactly as printed, including the " inch mark
#   verified  false until checked against the rendered page (scratch/dexter-pages/)
#   notes     things to check while verifying
#   header_printed  (optional, default true) false when the page prints no column
#             header row, so the 'header kept' check is skipped
#
# Every cell is single-quoted. Cells contain inch marks, commas and '#', which
# break or silently split unquoted YAML flow lists.
# Values were drafted from the page's text layer and cross-checked against the
# rendered image where noted. Row order follows the printed table.

