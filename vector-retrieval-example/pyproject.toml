[project]
name = "cs4300-vector-retrieval-example"
version = "0.1.0"
description = "Document ingestion and one-shot ReAct retrieval example for CS 4300"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.4,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-openai>=1.1,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.1,<2",
    "pypdf>=6.0,<7",
    "python-dotenv>=1.2,<2",
]

[tool.uv]
package = false
